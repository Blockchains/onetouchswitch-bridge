name: Pages (live JSON API + demo)
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 */3 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/build-site.mjs || (sleep 30; node scripts/build-site.mjs)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Live endpoints respond with CORS and fresh data
        run: |
          set -e
          B=https://blockchains.github.io/onetouchswitch-bridge
          sleep 20
          for f in ots gbp-usd payout-rails payout-cost rpc sanctioned-evm ots-pages provenance index; do
            curl -sSf --retry 6 --retry-all-errors --retry-delay 10 -D /tmp/h "$B/v1/$f.json" -o /tmp/b; grep -qi 'access-control-allow-origin: \*' /tmp/h; echo "ok $f $(wc -c </tmp/b) bytes"
          done
          curl -sSf "$B/v1/gbp-usd.json" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d['ethereum']['rate'];assert 0.8<r<2.5,r;print('GBP/USD',r)"
